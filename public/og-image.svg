<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <radialGradient id="ambientGlow" cx="28%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Shield & Column Gradients -->
    <linearGradient id="shieldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#0C4A6E" />
    </linearGradient>

    <linearGradient id="barBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="barOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <linearGradient id="barTeal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="checkCircleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0FDFA" />
    </linearGradient>

    <!-- Shadows -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0284C7" flood-opacity="0.06" />
    </filter>

    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0369A1" flood-opacity="0.18" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#ambientGlow)" />

  <!-- Subtle Decorative Grid Pattern in Corners -->
  <g opacity="0.35" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 8">
    <line x1="60" y1="60" x2="1140" y2="60" />
    <line x1="60" y1="570" x2="1140" y2="570" />
    <line x1="60" y1="60" x2="60" y2="570" />
    <line x1="1140" y1="60" x2="1140" y2="570" />
  </g>

  <!-- Main Content Container with High Craft Layout -->
  <g id="main-content" transform="translate(70, 75)">
    
    <!-- LEFT SIDE: Modern Vector Shield & Analytics Badge (Inspired 1:1 by user's logo) -->
    <g id="shield-logo" transform="translate(30, 10)" filter="url(#badgeShadow)">
      
      <!-- Ambient Back Shield Glow -->
      <path d="M 170 30 L 70 80 C 70 230 110 350 170 395 C 230 350 270 230 270 80 Z"
            fill="#E0F2FE" opacity="0.5" />

      <!-- Main Shield Outer Border -->
      <path d="M 170 40 L 80 88 C 80 220 120 330 170 372 C 220 330 260 220 260 88 Z"
            fill="#FFFFFF" stroke="url(#shieldBorderGrad)" stroke-width="10" stroke-linejoin="round" />

      <!-- Shield Inner Background -->
      <path d="M 170 54 L 92 98 C 92 215 128 315 170 355 C 212 315 248 215 248 98 Z"
            fill="#F8FAFC" />

      <!-- Inside Bar Chart Columns (Financial Growth Concept) -->
      <!-- Column 1: Blue (Left) -->
      <rect x="108" y="195" width="19" height="95" rx="3.5" fill="url(#barBlue)" />
      
      <!-- Column 2: Deep Blue / Navy (Center-Left) -->
      <rect x="135" y="150" width="21" height="150" rx="3.5" fill="#0284C7" />
      
      <!-- Column 3: Orange (Center Growth Peak) -->
      <rect x="164" y="115" width="22" height="190" rx="3.5" fill="url(#barOrange)" />
      
      <!-- Column 4: Teal (Right Pillar) -->
      <rect x="194" y="90" width="22" height="215" rx="3.5" fill="url(#barTeal)" />

      <!-- Growth Trend Ascending White Line Crossing the Bars -->
      <path d="M 104 220 L 140 185 L 175 130 L 222 75" 
            fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Center Verified Circle with Green Checkmark -->
      <g transform="translate(170, 235)" filter="url(#cardShadow)">
        <circle cx="0" cy="0" r="48" fill="url(#checkCircleGrad)" stroke="#0284C7" stroke-width="7" />
        <circle cx="0" cy="0" r="39" fill="#F0FDF4" stroke="#22C55E" stroke-width="3" />
        <!-- Checkmark icon -->
        <path d="M -16 2 L -5 14 L 18 -11" 
              fill="none" stroke="#16A34A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <!-- Dynamic Orbital Swirling Arrow (360° concept encircling the shield) -->
      <path d="M 50 250 C 35 285 75 325 170 330 C 265 330 300 280 290 250 C 282 225 250 205 200 200" 
            fill="none" stroke="url(#orbitGrad)" stroke-width="9" stroke-linecap="round" opacity="0.95" />
      
      <!-- Orbit Return Loop in front with arrow head -->
      <path d="M 285 240 C 295 270 260 315 170 320 C 85 320 40 280 48 245 C 52 230 70 215 95 205" 
            fill="none" stroke="#0284C7" stroke-width="8" stroke-linecap="round" />
      
      <!-- Orbit Arrow Pointer on Left -->
      <polygon points="40,245 68,230 60,265" fill="#0284C7" />
    </g>

    <!-- RIGHT SIDE: Typography, Brand and Value Proposition -->
    <g id="brand-text" transform="translate(375, 45)">
      
      <!-- Top Pill Tag -->
      <g transform="translate(0, 10)">
        <rect x="0" y="0" width="295" height="38" rx="19" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5" />
        <circle cx="20" cy="19" r="5" fill="#22C55E" />
        <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
              font-size="13" font-weight="700" fill="#1E40AF" letter-spacing="1">PLATAFORMA EMPRESARIAL 360°</text>
      </g>

      <!-- Main Headline: CONTROL FINANCIERO 360° -->
      <g transform="translate(0, 115)">
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Arial Black', Roboto, sans-serif" 
              font-size="70" font-weight="900" fill="#0A2540" letter-spacing="-1.5">CONTROL</text>
        
        <text x="0" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Arial Black', Roboto, sans-serif" 
              font-size="70" font-weight="900" fill="#0A2540" letter-spacing="-1.5">
          FINANCIERO <tspan fill="#0284C7">360°</tspan>
        </text>
      </g>

      <!-- Subtitle (Exact from Logo): CONTROL EMPRESARIAL Y AUDITORÍA EN TIEMPO REAL -->
      <g transform="translate(0, 232)">
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
              font-size="19" font-weight="800" fill="#334155" letter-spacing="2.2">
          CONTROL EMPRESARIAL Y AUDITORÍA EN TIEMPO REAL
        </text>
      </g>

      <!-- Divider line -->
      <line x1="0" y1="258" x2="680" y2="258" stroke="#E2E8F0" stroke-width="2" />

      <!-- Feature Highlights / Pillars -->
      <g transform="translate(0, 290)">
        <!-- Feature 1: Tesorería & Cheques -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="195" height="48" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
          <circle cx="24" cy="24" r="9" fill="#E0F2FE" />
          <text x="24" y="28" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0369A1" text-anchor="middle">✓</text>
          <text x="44" y="29" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">Tesorería &amp; Pagos</text>
        </g>

        <!-- Feature 2: Cartera & Cobranzas -->
        <g transform="translate(210, 0)">
          <rect x="0" y="0" width="205" height="48" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
          <circle cx="24" cy="24" r="9" fill="#FEF3C7" />
          <text x="24" y="28" font-family="sans-serif" font-size="11" font-weight="bold" fill="#B45309" text-anchor="middle">✓</text>
          <text x="44" y="29" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">Cartera &amp; Cobros</text>
        </g>

        <!-- Feature 3: Inventario Multi-Bodega -->
        <g transform="translate(430, 0)">
          <rect x="0" y="0" width="215" height="48" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
          <circle cx="24" cy="24" r="9" fill="#DCFCE7" />
          <text x="24" y="28" font-family="sans-serif" font-size="11" font-weight="bold" fill="#15803D" text-anchor="middle">✓</text>
          <text x="44" y="29" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">Bodegas &amp; Stock</text>
        </g>
      </g>

      <!-- Domain watermark -->
      <g transform="translate(0, 375)">
        <text x="0" y="0" font-family="monospace" font-size="13.5" font-weight="600" fill="#64748B">
          https://control-de-cheques-060526.vercel.app
        </text>
      </g>

    </g>
  </g>
</svg>
