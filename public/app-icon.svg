<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="appBgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </radialGradient>

    <!-- Shield & Column Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#0C4A6E" />
    </linearGradient>

    <linearGradient id="barBlueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="barOrangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <linearGradient id="barTealGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <linearGradient id="orbitGradIcon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.14" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0369A1" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- App Icon Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#appBgGrad)" />

  <!-- Shield Badge Centerpiece -->
  <g id="shield-badge" transform="translate(86, 45)" filter="url(#iconShadow)">
    <!-- Back shield glow border -->
    <path d="M 170 30 L 50 85 C 50 250 100 380 170 425 C 240 380 290 250 290 85 Z"
          fill="#FFFFFF" stroke="url(#shieldGrad)" stroke-width="14" stroke-linejoin="round" />

    <!-- Shield Inner Cavity -->
    <path d="M 170 46 L 66 96 C 66 238 110 358 170 402 C 230 358 274 238 274 96 Z"
          fill="#F8FAFC" />

    <!-- Growth Columns -->
    <!-- Col 1: Blue -->
    <rect x="86" y="210" width="24" height="115" rx="5" fill="url(#barBlueGrad)" />
    
    <!-- Col 2: Deep Blue -->
    <rect x="118" y="155" width="26" height="170" rx="5" fill="#0284C7" />
    
    <!-- Col 3: Orange Growth Peak -->
    <rect x="153" y="110" width="28" height="215" rx="5" fill="url(#barOrangeGrad)" />
    
    <!-- Col 4: Teal Pillar -->
    <rect x="190" y="80" width="28" height="245" rx="5" fill="url(#barTealGrad)" />

    <!-- Trend line across pillars -->
    <path d="M 80 235 L 125 195 L 167 130 L 222 68" 
          fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Verified Circle with Green Checkmark -->
    <g transform="translate(170, 255)">
      <circle cx="0" cy="0" r="54" fill="#FFFFFF" stroke="#0284C7" stroke-width="8" />
      <circle cx="0" cy="0" r="44" fill="#F0FDF4" stroke="#22C55E" stroke-width="3.5" />
      <!-- Checkmark -->
      <path d="M -18 2 L -6 16 L 20 -12" 
            fill="none" stroke="#16A34A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- 360 Dynamic Orbit Ring Encircling Shield -->
    <path d="M 15 270 C -5 315 45 365 170 370 C 290 370 335 310 320 270 C 310 240 270 215 210 210" 
          fill="none" stroke="url(#orbitGradIcon)" stroke-width="11" stroke-linecap="round" />
    
    <path d="M 315 258 C 325 295 285 350 170 355 C 65 355 10 305 20 265 C 25 248 45 230 80 218" 
          fill="none" stroke="#0284C7" stroke-width="10" stroke-linecap="round" />
    
    <!-- Orbit Arrowhead on Left -->
    <polygon points="10,265 44,248 34,288" fill="#0284C7" />
  </g>
</svg>
