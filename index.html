    <!-- Global Error Suppression for External Extension Noise (MetaMask, Web3) -->
    <script>
      (function() {
        const filteredStrings = [
          'metamask', 'ethereum', 'web3', 'failed to connect to metamask', 
          'extension', 'wallet', 'rpc error', 'inpage.js', 'provider',
          'method not found', 'user denied', 'eth_', 'personal_sign',
          'rly-root', 'trustwallet', 'phantom', 'solana', 'coinbase', 'brave'
        ];
        
        const isNoise = (val) => {
          if (!val) return false;
          try {
            const str = (typeof val === 'object' ? JSON.stringify(val) : String(val)).toLowerCase();
            if (filteredStrings.some(s => str.includes(s))) return true;
          } catch (e) {}
          const basicStr = String(val.message || val.stack || val || '').toLowerCase();
          return filteredStrings.some(s => basicStr.includes(s));
        };

        const filterFn = (args) => {
          try {
            return Array.from(args).some(arg => isNoise(arg));
          } catch (e) { return false; }
        };

        // Suppress all console methods for noise
        ['error', 'warn', 'info', 'debug', 'log'].forEach(method => {
          const original = console[method];
          console[method] = function() {
            if (filterFn(arguments)) return;
            if (original) original.apply(console, arguments);
          };
        });

        // Suppress window.onerror
        const originalOnerror = window.onerror;
        window.onerror = function(message, source, lineno, colno, error) {
          if (isNoise(message) || isNoise(error)) return true;
          if (originalOnerror) return originalOnerror.apply(window, arguments);
        };

        // Suppress unhandledrejection
        window.addEventListener('unhandledrejection', function(event) {
          if (isNoise(event.reason)) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);
      })();
    </script>
