    <!-- Global Error Suppression for External Extension Noise (MetaMask, Web3) -->
    <script>
      (function() {
        const filteredStrings = ['metamask', 'ethereum', 'web3', 'failed to connect to metamask', 'extension', 'wallet'];
        const filterFn = (args) => {
          const msg = Array.from(args).join(' ').toLowerCase();
          return filteredStrings.some(str => msg.includes(str));
        };

        // Suppress console methods
        ['error', 'warn', 'info', 'debug'].forEach(method => {
          const original = console[method];
          console[method] = function() {
            if (filterFn(arguments)) return;
            original.apply(console, arguments);
          };
        });

        // Suppress window.onerror
        const originalOnerror = window.onerror;
        window.onerror = function(message) {
          const msg = String(message).toLowerCase();
          if (filteredStrings.some(str => msg.includes(str))) return true;
          if (originalOnerror) return originalOnerror.apply(window, arguments);
        };

        // Suppress unhandledrejection
        window.addEventListener('unhandledrejection', function(event) {
          const reason = event.reason;
          const msg = String(reason?.message || reason || '').toLowerCase();
          if (filteredStrings.some(str => msg.includes(str))) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);
      })();
    </script>
